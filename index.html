<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Проходная</title>
    <!--
      SDK Яндекс Игр: подключаем ТОЛЬКО на хостинге Яндекса (games.s3.yandex.net и
      прочие домены *.yandex.ru/*.yandex.net) — там платформа отдаёт файл по пути
      ./sdk.js и window.YaGames появляется до вызова YaGames.init().
      На остальных хостингах (CrazyGames, itch, GitHub Pages, localhost) файла нет:
      слепой запрос ловился QA-инструментом CrazyGames как «Missing resource», поэтому
      загрузка условная, но всё ещё синхронная (document.write при парсинге head).
      Не на Яндексе активируется LocalPlatform (заглушка).
    -->
    <script>
      if (/(^|\.)(yandex\.ru|yandex\.net)$/i.test(location.hostname)) {
        document.write('<script src="./sdk.js"><\/script>');
      }
    </script>
    <style>
      /* Шрифт «Мульт-поп»: субсеты с unicode-range, пути относительные (требование хостинга Яндекса) */
      @font-face {
        font-family: 'Balsamiq Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/balsamiq-400-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Balsamiq Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/balsamiq-400-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Balsamiq Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/balsamiq-700-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Balsamiq Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/balsamiq-700-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+FEFF, U+FFFD;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffedd3;
        overflow: hidden;
        touch-action: none;
        /* Требование CrazyGames (мобильные): без этого выделение текста/зум
           ломают тап-управление; вендорные префиксы — как в их доке */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
    #app {
      width: 100%;
      height: 100dvh;
    }
    /* Адаптивный вьюпорт (render/layout.ts): холст занимает всё окно, backing
       store ведёт layout.ts — CSS-размер фиксирован на 100% от #app */
    #app canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
